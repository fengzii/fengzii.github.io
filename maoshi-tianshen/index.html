<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#10231F">
<title>冒失天神</title>
<meta name="description" content="勇者只会埋头向前走。你是旁观的天神，用落石、木板、圣光改写他的路。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232E6B63'/%3E%3Ccircle cx='32' cy='27' r='11' fill='%23F5D79B'/%3E%3Cpath d='M10 32h44' stroke='%23F5D79B' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<div class="app">
  <header class="topbar">
    <div class="brand" aria-label="冒失天神">
      <span class="halo" aria-hidden="true">
        <svg viewBox="0 0 64 64"><ellipse cx="32" cy="14" rx="15" ry="5" fill="none" stroke="currentColor" stroke-width="3.4"/></svg>
      </span>
      <span class="brand-txt">
        <b>冒失<em>天神</em></b>
        <i id="lvlName">第 1 关</i>
      </span>
    </div>

    <div class="reads">
      <div class="read"><span>用时</span><b id="timeVal">0.0s</b></div>
      <div class="read"><span>追击</span><b id="gapTxt">—</b></div>
    </div>

    <div class="acts">
      <button class="icon-btn" id="btnPause" title="暂停（空格）" aria-label="暂停">Ⅱ</button>
      <button class="icon-btn" id="btnRestart" title="重开（R）" aria-label="重开本关">↻</button>
    </div>
  </header>

  <div class="gaptrack" aria-hidden="true"><i id="gapFill"></i></div>

  <main class="board">
    <canvas id="stage" aria-label="迷宫舞台"></canvas>
    <canvas id="minimap" aria-hidden="true"></canvas>

    <div class="hint" id="hint"><span class="dot"></span><span id="hintText">等待开始…</span></div>

    <div class="demo-overlay" id="ov">
      <div class="panel">
        <div class="eyebrow" id="ovEyebrow">LEVEL FAILED</div>
        <h4 id="ovTitle">被抓住了</h4>
        <p id="ovDesc">他绕进了死路，又原路折返。</p>
        <div class="stats" id="ovStats"></div>
        <div class="ov-actions">
          <button class="btn" id="ovRetry">重试本关</button>
          <button class="btn ghost" id="ovNext" hidden>下一关</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="dock">
    <button class="tool on" id="toolRock" data-tool="rock" title="落石：封路、填坑、砸小怪（1）">
      <span class="tool-ico"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l2-7 6-3 6 3 2 7-3 3H7z" fill="#B9B4A8" stroke="#20302D" stroke-width="1.6"/><path d="M8 11l4-2 2 2" fill="none" stroke="#E6E2D6" stroke-width="1.6" stroke-linecap="round"/></svg></span>
      <span class="tool-nm">落石</span>
      <span class="cnt" id="rockCnt">1</span>
    </button>
    <button class="tool" id="toolPlank" data-tool="plank" title="木板：铺过水面、熔岩、尖刺与泥沼（2）">
      <span class="tool-ico"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l18-6" stroke="#B57B44" stroke-width="6" stroke-linecap="round"/><path d="M6 12l14-5M8 16l13-5" stroke="#7E5129" stroke-width="1.2"/></svg></span>
      <span class="tool-nm">木板</span>
      <span class="cnt" id="plankCnt">0</span>
    </button>
    <button class="tool" id="toolLight" title="圣光：让大怪物停顿 3 秒（3）">
      <span class="tool-ico"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="#F0C578" stroke="#7A4F08" stroke-width="1.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" stroke="#7A4F08" stroke-width="1.6" stroke-linecap="round"/></svg></span>
      <span class="tool-nm">圣光</span>
      <span class="cnt" id="lightCnt">0</span>
    </button>
    <button class="tool" id="toolBomb" data-tool="bomb" title="炸弹：炸开一格内墙（4）">
      <span class="tool-ico"><svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="15" r="6.2" fill="#4A4A48" stroke="#1B1B19" stroke-width="1.6"/><path d="M14 9l3-3M17 6l2-2M19 6l1.5 1.5" stroke="#B57B44" stroke-width="1.8" stroke-linecap="round"/><circle cx="19" cy="4" r="1.5" fill="#F2793C"/></svg></span>
      <span class="tool-nm">炸弹</span>
      <span class="cnt" id="bombCnt">0</span>
    </button>
  </footer>
</div>

<script src="js/game.js"></script>
</body>
</html>
